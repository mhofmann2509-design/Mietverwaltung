name: Mietverwaltung
options:
  bundleIdPrefix: com.marcelhofmann
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: Mietverwaltung
    PRODUCT_BUNDLE_IDENTIFIER: com.marcelhofmann.mietverwaltung
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Mietverwaltung
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

targets:
  Mietverwaltung-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/PreviewContent
    dependencies:
      - package: ZIPFoundation
    entitlements:
      path: Mietverwaltung-iOS.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.marcelhofmann.mietverwaltung]
        com.apple.developer.icloud-services: [CloudKit]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        DEVELOPMENT_ASSET_PATHS: "Resources/PreviewContent"
        INFOPLIST_KEY_NSCameraUsageDescription: "Wird verwendet, um Belege (Rechnungen, Quittungen) direkt einzuscannen."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Wird verwendet, um Termine wie die Eigentümerversammlung als Kalendereintrag mit Erinnerung anzulegen."

  Mietverwaltung-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: ZIPFoundation
    entitlements:
      path: Mietverwaltung-macOS.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.marcelhofmann.mietverwaltung]
        com.apple.developer.icloud-services: [CloudKit]
    settings:
      base:
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Wird verwendet, um Termine wie die Eigentümerversammlung als Kalendereintrag mit Erinnerung anzulegen."

  MietverwaltungTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: Mietverwaltung-macOS
    settings:
      base:
        PRODUCT_NAME: MietverwaltungTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mietverwaltung.app/Contents/MacOS/Mietverwaltung"
        BUNDLE_LOADER: "$(TEST_HOST)"

  MietverwaltungTests-iOS:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: Mietverwaltung-iOS
    settings:
      base:
        PRODUCT_NAME: MietverwaltungTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mietverwaltung.app/Mietverwaltung"
        BUNDLE_LOADER: "$(TEST_HOST)"

  MietverwaltungUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: Mietverwaltung-iOS
    settings:
      base:
        PRODUCT_NAME: MietverwaltungUITests
        TEST_TARGET_NAME: Mietverwaltung-iOS

schemes:
  Mietverwaltung-iOS:
    build:
      targets:
        Mietverwaltung-iOS: all
        MietverwaltungTests-iOS: [test]
        MietverwaltungUITests: [test]
    run:
      config: Debug
    test:
      targets:
        - MietverwaltungTests-iOS
        - MietverwaltungUITests
  Mietverwaltung-macOS:
    build:
      targets:
        Mietverwaltung-macOS: all
        MietverwaltungTests: [test]
    run:
      config: Debug
    test:
      targets:
        - MietverwaltungTests
